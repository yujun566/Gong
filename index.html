<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>공</title>
<style>
  :root{--bg:#060a12;--panel:#0d1420;--line:#16314a;--cyan:#38e8ff;--cyan2:#0a8fb0;--txt:#d9f3ff;--dim:#6f93a8;--warn:#ffb347;--bad:#ff5c7a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
  header b{letter-spacing:4px;color:var(--cyan);font-size:18px}
  header .st{font-size:11px;color:var(--dim)}
  header button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:12px}
  #log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
  .m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .u{align-self:flex-end;background:#15324a;border-bottom-right-radius:3px}
  .g{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
  .s{align-self:center;color:var(--dim);font-size:12px;background:none}
  .t{align-self:flex-start;color:var(--cyan2);font-size:12px;font-family:monospace}
  /* 자비스 링 */
  #ring{position:relative;width:150px;height:150px;margin:6px auto 2px;display:grid;place-items:center}
  #ring .c{position:absolute;border-radius:50%;border:2px solid var(--cyan);opacity:.35}
  #ring .c1{inset:0}#ring .c2{inset:14px;border-style:dashed;opacity:.25}#ring .c3{inset:28px;opacity:.15}
  #ring .core{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,#0e3a4d,#071a24 70%);border:2px solid var(--cyan);display:grid;place-items:center;font-size:30px;color:var(--cyan);user-select:none}
  #ring.listen .c1{animation:spin 3s linear infinite;opacity:.8}
  #ring.listen .c2{animation:spin 2s linear infinite reverse;opacity:.6}
  #ring.listen .core{box-shadow:0 0 30px var(--cyan)}
  #ring.think .c3{animation:pulse 1s ease-in-out infinite}
  #ring.speak .core{animation:pulse .5s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.08);opacity:1}}
  #hint{text-align:center;color:var(--dim);font-size:12px;min-height:16px}
  #bar{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:center}
  #bar input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:22px;padding:11px 14px;font-size:15px;outline:none}
  .ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--cyan);font-size:18px;display:grid;place-items:center}
  .ib.on{background:var(--cyan2);color:#fff;border-color:var(--cyan)}
  .ib.off{color:var(--dim)}
  #talk{width:64px;height:64px;font-size:26px;border:2px solid var(--cyan)}
  #talk.active{background:var(--cyan);color:#000;box-shadow:0 0 24px var(--cyan)}
  /* 설정 */
  #settings{position:fixed;inset:0;background:rgba(3,6,10,.96);display:none;flex-direction:column;padding:18px;overflow-y:auto;z-index:9}
  #settings.open{display:flex}
  #settings h3{color:var(--cyan);margin:6px 0 10px}
  #settings label{display:block;color:var(--dim);font-size:12px;margin:12px 0 4px}
  #settings input,#settings select,#settings textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;font-size:14px}
  #settings .row{display:flex;gap:8px;align-items:center}
  #settings .row label{margin:0;flex:1}
  #settings button{background:var(--cyan2);border:none;color:#fff;border-radius:8px;padding:12px;font-size:15px;margin-top:16px}
  #settings .sub{background:none;border:1px solid var(--line);color:var(--dim);font-size:13px;padding:8px;margin-top:8px}
  #settings small{color:var(--dim);display:block;margin-top:4px;line-height:1.4}
  #cam,#imp{display:none}
  #quick{display:flex;gap:6px;padding:0 12px 6px;overflow-x:auto}
  #quick button{flex:1;min-width:70px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 4px;font-size:12px;white-space:nowrap}
  .m svg{width:100%;height:auto;background:#0a1220;border-radius:8px}
  .m.pic{max-width:96%;width:96%}
  .m img{max-width:100%;border-radius:8px;display:block}
  .srv{align-self:flex-start;background:#0a1a12;border:1px solid #1d4a2e;font-family:monospace;font-size:12px;max-width:95%}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><b>공</b> <span class="st" id="status">준비 중</span></div>
    <div><button id="btnMem">기억</button> <button id="btnSet">⚙</button></div>
  </header>
  <div id="log"></div>
  <div id="ring"><div class="c c1"></div><div class="c c2"></div><div class="c c3"></div><div class="core">공</div></div>
  <div id="hint"></div>
  <div id="quick"></div>
  <div id="bar">
    <button class="ib" id="btnCam" title="사진 보고 해결">📷</button>
    <button class="ib" id="btnVoice" title="목소리">🔈</button>
    <button class="ib" id="talk" title="누른 채 말하기">🎤</button>
    <button class="ib" id="btnAlways" title="항상 듣기">👂</button>
    <input id="txt" placeholder="타이핑 또는 🎤 누른 채 말하기" autocomplete="off">
  </div>
</div>
<input type="file" id="cam" accept="image/*" capture="environment">
<input type="file" id="imp" accept="application/json">

<div id="settings">
  <h3>⚙ 설정</h3>
  <label>Groq API 키 (무료: console.groq.com → API Keys)</label>
  <input id="sKey" type="password" placeholder="gsk_...">
  <label>뇌 모델 <button class="sub" id="sRefresh" style="padding:2px 8px;margin:0;font-size:11px">목록 새로고침</button></label>
  <select id="sModel"><option value="auto">자동 (추천)</option></select>
  <label>사진 보는 모델 (📷)</label>
  <select id="sVision"><option value="auto">자동</option></select>
  <label>내 이름</label><input id="sUser" placeholder="유준">
  <label>호출어 (항상 듣기 모드에서 이 말로 시작할 때만 반응. 비우면 전부 반응)</label><input id="sWake" placeholder="공">
  <label>목소리</label><select id="sVoice"></select>
  <div class="row"><label>말 속도</label><input id="sRate" type="range" min="0.8" max="1.6" step="0.1" style="width:55%"></div>
  <label>집 주소 (길찾기용, 예: 서울 강남구 ...)</label><input id="sHome" placeholder="집 주소">
  <label>리눅스 서버 URL (gong_server.py + cloudflared 주소)</label><input id="sSrv" placeholder="https://xxxx.trycloudflare.com">
  <label>리눅스 서버 토큰</label><input id="sSrvTok" type="password" placeholder="gong_token.txt 내용">
  <label>빠른 버튼 4개 (이름=말할 내용, 줄바꿈 구분)</label><textarea id="sQuick" rows="4"></textarea>
  <label>성격 (시스템 프롬프트 추가)</label><textarea id="sPersona" rows="3" placeholder="예: 반말로 짧게. 가끔 농담."></textarea>
  <button id="sSave">저장</button>
  <button class="sub" id="sTestVoice">목소리 테스트</button>
  <button class="sub" id="sClear">대화 기록 지우기</button>
  <button class="sub" id="sExport">⬇ 백업 내보내기 (기억·메모·설정)</button>
  <button class="sub" id="sImport">⬆ 백업 가져오기</button>
  <button class="sub" id="sTutorial">📖 튜토리얼 열기</button>
  <small>• 마이크/목소리는 기본 꺼짐. 🎤 누른 채 말하기 / 👂 항상 듣기 / 🔈 목소리.<br>• 모든 데이터는 이 폰 안(localStorage)에만 저장. API 키도 서버로 안 감(Groq로만 직접 전송).<br>• 안드로이드 음성 인식은 삼성 인터넷보다 <b>Chrome</b>에서 가장 잘 됨.</small>
</div>

<script>
/* =========================================================
   공 모바일 — Groq 뇌 + 폰 내장 귀/입 + 기억 + 도구
   ========================================================= */
const $ = s => document.querySelector(s);
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem('gong.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => localStorage.setItem('gong.' + k, JSON.stringify(v)),
};
const cfg = {
  key: LS.get('key', ''), model: LS.get('model', 'auto'), models: LS.get('models', []),
  vision: LS.get('vision', 'auto'),
  user: LS.get('user', ''), wake: LS.get('wake', '공'), voiceName: LS.get('voiceName', ''),
  rate: LS.get('rate', 1.15), persona: LS.get('persona', ''),
  voiceOn: LS.get('voiceOn', false), always: false,
  modelsAt: LS.get('modelsAt', 0), home: LS.get('home', ''), srv: LS.get('srv', ''), srvTok: LS.get('srvTok', ''),
  quick: LS.get('quick', '타이머=5분 타이머\n날씨=오늘 날씨 어때\n기억=뭐 기억해\n서버=서버 상태 확인해줘'),
};
let lastPos = null;
const NATIVE = !!window.Android;          // 안드로이드 앱 안에서 실행 중이면 true
const openExt = url => { if (NATIVE) Android.openUrl(url); else window.open(url, '_blank'); };
let history = LS.get('history', []);
let memory = LS.get('memory', []);      // [{d:'2026-11-06', t:'...'}]
let notes = LS.get('notes', []);
let busy = false, abortCtl = null;

const SITES = {유튜브:'https://m.youtube.com', 깃허브:'https://github.com', 구글:'https://www.google.com', 네이버:'https://m.naver.com',
  디스코드:'https://discord.com/app', 로블록스:'https://www.roblox.com', 콜랩:'https://colab.research.google.com', 지메일:'https://mail.google.com',
  클로드:'https://claude.ai', 챗지피티:'https://chat.openai.com', 허깅페이스:'https://huggingface.co', 나무위키:'https://namu.wiki',
  위키백과:'https://ko.m.wikipedia.org', 번역기:'https://papago.naver.com', 날씨:'https://weather.naver.com', 치지직:'https://chzzk.naver.com',
  트위치:'https://m.twitch.tv', 넷플릭스:'https://www.netflix.com', 지도:'https://map.naver.com', 유튜브뮤직:'https://music.youtube.com'};

/* ---------------- UI ---------------- */
const log = $('#log'), ring = $('#ring'), hint = $('#hint'), status = $('#status');
function add(cls, text) { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
function setRing(mode, h = '') { ring.className = mode; hint.textContent = h; }
let shownModel = '';
function setStatus() { if (cfg.key) brainModel().then(m => { shownModel = m; status.textContent = (m || '?').split('/').pop() + (cfg.voiceOn ? ' · 🔈' : ' · 🔇') + (cfg.always ? ' · 👂' : ''); }).catch(() => {}); status.textContent = (cfg.key ? (shownModel || cfg.model).split('/').pop() : '키 없음') + (cfg.voiceOn ? ' · 🔈' : ' · 🔇') + (cfg.always ? ' · 👂' : ''); $('#btnVoice').className = 'ib ' + (cfg.voiceOn ? 'on' : 'off'); $('#btnAlways').className = 'ib ' + (cfg.always ? 'on' : 'off'); }

/* ---------------- 입 (TTS) ---------------- */
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() {
  voices = synth.getVoices().filter(v => v.lang.replace('_', '-').toLowerCase().startsWith('ko'));
  const sel = $('#sVoice'); sel.innerHTML = '';
  if (!voices.length) { sel.innerHTML = '<option value="">(한국어 음성 없음 → 설정 > 일반 > TTS 에서 한국어 설치)</option>'; return; }
  voices.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name + (v.localService ? ' (오프라인)' : ''); sel.appendChild(o); });
  if (!cfg.voiceName || !voices.find(v => v.name === cfg.voiceName)) cfg.voiceName = (voices.find(v => /ko-KR-language|Google/.test(v.name)) || voices[0]).name;
  sel.value = cfg.voiceName;
}
synth.onvoiceschanged = loadVoices; loadVoices();
function clean(t) { return t.replace(/```[\s\S]*?```/g, ' 코드는 화면에 있어요. ').replace(/`[^`]*`/g, '').replace(/https?:\/\/\S+/g, '링크').replace(/[*_#>|~]/g, '').trim(); }
function speak(text) {
  if (!cfg.voiceOn || !text) return;
  if (NATIVE) { setRing('speak', '말하는 중… (탭하면 끊기)'); Android.speak(clean(text).split(/(?<=[.!?。])\s+|\n+/).filter(Boolean).slice(0, 6).join(' ')); return; }
  synth.cancel();
  const parts = clean(text).split(/(?<=[.!?。])\s+|\n+/).filter(Boolean).slice(0, 6);
  setRing('speak', '말하는 중… (탭하면 끊기)');
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p); u.lang = 'ko-KR'; u.rate = cfg.rate;
    const v = voices.find(v => v.name === cfg.voiceName); if (v) u.voice = v;
    if (i === parts.length - 1) u.onend = () => { if (ring.className === 'speak') setRing('', ''); if (cfg.always) startAlways(); };
    synth.speak(u);
  });
}
function shutUp() { if (NATIVE) Android.stopSpeak(); synth.cancel(); if (ring.className === 'speak') setRing('', ''); }

/* ---------------- 귀 (STT) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recMode = null;   // 'ptt' | 'always'
function makeRec(continuous) {
  if (!SR) { add('s', '이 브라우저는 음성 인식이 안 돼요. Chrome으로 열어주세요.'); return null; }
  const r = new SR(); r.lang = 'ko-KR'; r.continuous = continuous; r.interimResults = true; r.maxAlternatives = 3;
  let final = '';
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) final += pickAlt(res); else interim += res[0].transcript;
    }
    hint.textContent = (final + interim).trim() || '듣는 중…';
    if (continuous && final.trim()) { const t = final.trim(); final = ''; onHeard(t, true); }
  };
  r.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') add('s', '음성 오류: ' + e.error); };
  r.onend = () => {
    if (recMode === 'ptt' && final.trim()) { const t = final.trim(); final = ''; onHeard(t, false); }
    else if (recMode === 'ptt') setRing('', '');
    if (recMode === 'always' && cfg.always && !busy && ring.className !== 'speak') { try { r.start(); } catch {} }   // 자동 재시작
    if (recMode === 'ptt') recMode = null;
  };
  return r;
}
function pickAlt(res) {
  // 후보 중 호출어/사이트/명령 키워드가 들어간 걸 우선
  const keys = [cfg.wake, cfg.user, ...Object.keys(SITES), '열어', '켜', '꺼', '기억', '타이머', '메모'].filter(Boolean);
  for (let i = 0; i < res.length; i++) if (keys.some(k => res[i].transcript.includes(k))) return res[i].transcript;
  return res[0].transcript;
}
function startPTT() { if (busy) return; shutUp(); if (NATIVE) { setRing('listen', '듣는 중… 말 끝나면 자동 실행'); Android.listenOnce(); return; } stopAlways(); rec = makeRec(false); if (!rec) return; recMode = 'ptt'; setRing('listen', '듣는 중… 떼면 실행'); try { rec.start(); } catch {} }
function stopPTT() { if (NATIVE) return; if (recMode === 'ptt' && rec) { setTimeout(() => { try { rec.stop(); } catch {} }, 250); } }
let alwaysRec = null;
function startAlways() { if (NATIVE) { Android.setListening(true); setRing('listen', `"${cfg.wake}"으로 시작하는 말에 반응 · 화면 꺼져도 OK`); return; } if (!cfg.always || busy) return; if (!alwaysRec) { alwaysRec = makeRec(true); if (!alwaysRec) { cfg.always = false; setStatus(); return; } } recMode = 'always'; setRing('listen', cfg.wake ? `"${cfg.wake}"으로 시작하는 말에 반응` : '듣는 중'); try { alwaysRec.start(); } catch {} }
function stopAlways() { if (NATIVE) { Android.setListening(false); setRing('', ''); return; } if (alwaysRec) { try { alwaysRec.abort(); } catch {} } if (recMode === 'always') { recMode = null; setRing('', ''); } }

/* ---------------- 명령어 (뇌 안 거침) ---------------- */
const norm = s => s.toLowerCase().replace(/[^\w\s가-힣]/g, ' ').replace(/\s+/g, ' ').replace(/(해\s?주세요|해\s?줘|해\s?봐|주세요|줘|해|요)$/, '').trim();
function quick(text) {
  let t = norm(text);
  if (cfg.wake) t = t.replace(new RegExp('^' + cfg.wake + '\\s*[,아야]?\\s*'), '');
  const has = (...k) => k.some(x => t.includes(x));
  if (has('소리 켜', '목소리 켜', '말해도')) { cfg.voiceOn = true; LS.set('voiceOn', true); setStatus(); return '목소리 켰어요.'; }
  if (has('소리 꺼', '목소리 꺼', '조용히', '쉿', '그만 말')) { cfg.voiceOn = false; LS.set('voiceOn', false); shutUp(); setStatus(); return '목소리 껐어요.'; }
  if (has('항상 들', '마이크 켜')) { cfg.always = true; setStatus(); startAlways(); return '항상 듣기 켰어요.'; }
  if (has('그만 들', '마이크 꺼')) { cfg.always = false; setStatus(); stopAlways(); return '항상 듣기 껐어요.'; }
  if (has('기억 초기화', '대화 지워')) { history = []; LS.set('history', []); return '대화 기록 지웠어요.'; }
  if (/^(뭐 기억|기억 보여|나에 대해 뭐)/.test(t)) return tools.recall({});
  const m = t.match(/^(?:이거 )?기억(?:해)?\s+(.+)/); if (m) return tools.remember({ fact: m[1] });
  for (const [name, url] of Object.entries(SITES)) if (t.startsWith(name) && has('열', '켜', '들어가', '가')) return tools.open_url({ url });
  const mu = t.match(/^(?:노래|음악)\s*(?:틀어|재생)\s*(.+)?$|^(.+?)\s*(?:노래|음악)\s*(?:틀어|재생)/);
  if (mu) return tools.play_music({ query: (mu[1] || mu[2] || '').trim() });
  const ys = t.match(/^유튜브(?:에서)?\s+(.+?)\s*(?:검색|찾아|틀어)/); if (ys) return tools.open_url({ url: 'https://m.youtube.com/results?search_query=' + encodeURIComponent(ys[1]) });
  const gs = t.match(/^(?:구글|검색)(?:에서)?\s+(.+?)\s*(?:검색|찾아)?$/); if (gs && has('검색', '찾아')) return tools.web_search({ query: gs[1] });
  const tm = t.match(/(\d+)\s*분\s*(?:뒤|후)?\s*(?:타이머|알려|깨워)/); if (tm) return tools.set_timer({ minutes: +tm[1] });
  if (/^(지금 )?몇\s?시/.test(t)) return tools.now({});
  return null;
}

/* ---------------- 도구 (뇌가 호출) ---------------- */
const tools = {
  open_url: ({ url }) => { if (!/^https?:/.test(url)) url = SITES[url] || 'https://' + url; openExt(url); return '열었어요: ' + url; },
  web_search: ({ query }) => { openExt('https://www.google.com/search?q=' + encodeURIComponent(query)); return '구글 검색: ' + query; },
  youtube_search: ({ query }) => { openExt('https://m.youtube.com/results?search_query=' + encodeURIComponent(query)); return '유튜브 검색: ' + query; },
  now: () => { const d = new Date(); return d.toLocaleString('ko-KR', { weekday: 'long', hour: 'numeric', minute: 'numeric', month: 'long', day: 'numeric' }); },

const SKIP = /whisper|tts|guard|compound|orpheus|embed|moderation|safeguard/i;
const BRAIN_PREF = [/gpt-oss-120b/i, /kimi-k2/i, /llama-3\.3-70b/i, /qwen3/i, /llama-4-maverick/i, /llama-4-scout/i, /gpt-oss-20b/i, /70b/i, /32b/i, /./];
const VISION_PREF = [/maverick/i, /scout/i, /vision|vl\b|llava/i, /vl/i];
const FAST_PREF = [/gpt-oss-20b/i, /8b/i, /instant/i];
async function fetchModels(force = false) {
  if (cfg.models.length && !force && cfg.modelsAt && Date.now() - cfg.modelsAt < 86400000) return cfg.models;
  const r = await fetch('https://api.groq.com/openai/v1/models', { headers: { Authorization: 'Bearer ' + cfg.key } });
  if (!r.ok) throw new Error('모델 목록 조회 실패 ' + r.status);
  const ids = (await r.json()).data.map(m => m.id).filter(id => !SKIP.test(id));
  cfg.models = ids; cfg.modelsAt = Date.now(); LS.set('models', ids); LS.set('modelsAt', cfg.modelsAt);
  return ids;
}
function pickBy(prefs, ids) { for (const p of prefs) { const hit = ids.find(id => p.test(id)); if (hit) return hit; } return null; }
async function resolveModel(kind = 'brain', force = false) {
  const ids = await fetchModels(force);
  if (kind === 'vision') return pickBy(VISION_PREF, ids);           // 없으면 null
  return pickBy(BRAIN_PREF, ids) || ids[0];
}
async function brainModel() { if (cfg.model !== 'auto' && cfg.models.includes(cfg.model)) return cfg.model; if (cfg.model !== 'auto' && !cfg.models.length) return cfg.model; return await resolveModel('brain'); }
async function visionModel() { if (cfg.vision !== 'auto') return cfg.vision; return await resolveModel('vision'); }
function fillModelSelects() {
  const mk = (sel, ids, cur) => { sel.innerHTML = '<option value="auto">자동 (추천)</option>' + ids.map(id => `<option value="${id}">${id}</option>`).join(''); sel.value = ids.includes(cur) || cur === 'auto' ? cur : 'auto'; };
  mk($('#sModel'), cfg.models, cfg.model); mk($('#sVision'), cfg.models.filter(id => VISION_PREF.some(p => p.test(id))), cfg.vision);
}
$('#sRefresh').onclick = async e => { e.preventDefault(); if (!$('#sKey').value.trim()) return; cfg.key = $('#sKey').value.trim(); try { await fetchModels(true); fillModelSelects(); add('s', `모델 ${cfg.models.length}개: ${cfg.models.slice(0, 6).join(', ')}…`); } catch (err) { add('s', err.message); } };

function systemPrompt() {
  const mem = memory.slice(-60).map(m => '- ' + m.t).join('\n');
  return `너는 '공'. ${cfg.user || '사용자'}의 폰 안에서 일하는 개인 AI 비서.
- 한국어로 짧고 시원하게. 아이언맨의 자비스처럼 침착하고 약간 재치있게. 답은 기본 1~3문장.
- 음성으로 읽힐 수 있으니 마크다운 기호를 본문에 쓰지 않는다. 코드는 코드블록으로.
- 사용자의 말은 음성 인식을 거쳐 오므로 오타/비슷한 발음 오류가 섞일 수 있다. 문맥으로 의도를 추측해 처리하고 정말 모를 때만 되묻는다.
- 할 수 있는 건 도구로 직접 한다. 사용자가 자기 정보(취향, 일정, 이름)를 말하면 remember로 저장.
- 최신 정보/사실 확인은 web_answer, 날씨는 weather, 환율은 exchange_rate. 추측으로 답하지 말 것.
- 구조·흐름·비교·위치 관계 등 그림이 이해를 돕는 설명이면 draw_svg로 도식을 그리고 말로 보충. 글자는 한국어, 밝은 색.
- 리눅스 서버 작업: server_ls/read로 먼저 확인 → server_replace로 수정 → server_run으로 실행/테스트 → 결과 보고. 삭제나 위험 명령은 사용자에게 먼저 물어본다.
- 지금 시각: ${new Date().toLocaleString('ko-KR')}
${cfg.persona ? '- ' + cfg.persona : ''}
${mem ? '\n[기억하는 것]\n' + mem : ''}`;
}
async function groq(messages, { model = null, useTools = true, _retry = true } = {}) {
  if (!model) model = await brainModel();
  abortCtl = new AbortController();
  const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST', signal: abortCtl.signal,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
    body: JSON.stringify({ model, messages, temperature: 0.4, max_tokens: 700, ...(useTools ? { tools: TOOL_SCHEMAS, tool_choice: 'auto' } : {}) }),
  });
  if (!r.ok) {
    const e = await r.text();
    if (r.status === 404 && /model/i.test(e) && _retry) {          // 모델 사라짐 → 목록 새로 받고 자동 재선택
      add('s', `모델 ${model} 없어짐 → 자동 재선택`);
      cfg.model = 'auto'; LS.set('model', 'auto');
      const m2 = await resolveModel('brain', true);
      setStatus();
      return groq(messages, { model: m2, useTools, _retry: false });
    }
    throw new Error(r.status + ' ' + e.slice(0, 200));
  }
  return (await r.json()).choices[0].message;
}

  let msgs = [{ role: 'system', content: systemPrompt() }, ...history];
  if (image) {
    const vm = await visionModel();
    if (!vm) { msgs[msgs.length - 1] = { role: 'user', content: `(사진을 첨부했지만 지금 Groq에 사진 보는 모델이 없어서 못 봤다고 사용자에게 알려줘) ${userText}` }; }
    else { const v = await groq([{ role: 'user', content: [{ type: 'image_url', image_url: { url: image } }, { type: 'text', text: '이 사진/화면에 보이는 걸 한국어로 자세히 설명하고, 텍스트는 그대로 읽어줘. 에러나 문제가 보이면 짚어줘.' }] }], { model: vm, useTools: false });
    msgs[msgs.length - 1] = { role: 'user', content: `[사진 내용]\n${v.content}\n\n[사용자 요청]\n${userText}` }; }
  }
  for (let i = 0; i < 6; i++) {
    const m = await groq(msgs);
    if (!m.tool_calls || !m.tool_calls.length) { const out = (m.content || '').trim(); history.push({ role: 'assistant', content: out }); LS.set('history', history); return out; }
    msgs.push(m);
    for (const c of m.tool_calls) {
      let args = {}; try { args = JSON.parse(c.function.arguments || '{}'); } catch {}
      add('t', `🔧 ${c.function.name}(${Object.values(args).join(', ').slice(0, 60)})`);
      const fn = tools[c.function.name]; let out = fn ? await fn(args) : '없는 도구';
      msgs.push({ role: 'tool', tool_call_id: c.id, content: String(out) });
    }
  }
  return '도구를 너무 많이 호출해서 멈췄어요.';
}

/* ---------------- 처리 루프 ---------------- */
let pending = null;
async function onHeard(text, fromAlways) {
  text = text.trim(); if (!text) return;
  if (fromAlways && cfg.wake && !text.startsWith(cfg.wake)) return;   // 호출어 없는 말은 무시
  if (busy) { pending = text; shutUp(); if (abortCtl) abortCtl.abort(); return; }   // 최신 말만
  busy = true; shutUp(); if (!NATIVE) stopAlways();
  add('u', text); setRing('think', '생각 중…');
  try {
    let reply = quick(text);
    if (reply === null) reply = await ask(text, pendingImage); pendingImage = null;
    if (reply) { add('g', reply); speak(reply); }
  } catch (e) {
    if (e.name !== 'AbortError') add('s', '오류: ' + e.message + (/401|invalid_api_key/i.test(e.message) ? ' → 설정에서 API 키 확인' : ''));
  } finally {
    busy = false; if (ring.className === 'think') setRing('', '');
    if (pending) { const p = pending; pending = null; onHeard(p, false); } else if (!NATIVE && cfg.always && !synth.speaking) startAlways();
  }
}

/* ---------------- 네이티브(안드로이드 앱) 콜백 ---------------- */
window.onAndroidHeard = (text, fromAlways) => { onHeard(text, false); };          // 호출어는 네이티브에서 이미 확인
window.onAndroidPartial = t => { hint.textContent = t; };
window.onAndroidState = st => { if (st === 'listen' && !busy) setRing('listen', cfg.always ? `👂 항상 듣기 (호출어 "${cfg.wake}")` : '듣는 중…'); else if (st === 'speak') setRing('speak', '말하는 중… (탭하면 끊기)'); else if (st === 'idle' && !busy) setRing('', cfg.always ? '👂 대기' : ''); };
window.onAndroidListening = on => { cfg.always = on; setStatus(); };
if (NATIVE) { try { cfg.always = Android.isListening(); Android.setWake(cfg.wake); } catch {} }

/* ---------------- 📷 사진 보고 해결 ---------------- */
let pendingImage = null;
$('#btnCam').onclick = () => $('#cam').click();
$('#cam').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const b = await new Promise(res => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); const s = Math.min(1, 1280 / Math.max(img.width, img.height)); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.8)); }; img.src = URL.createObjectURL(f); });
  pendingImage = b; add('s', '📷 사진 첨부됨. 뭘 할지 말하거나 타이핑 (예: 이 에러 고쳐줘)'); $('#txt').focus();
  e.target.value = '';
};

/* ---------------- 이벤트 ---------------- */
const talk = $('#talk');
const down = e => { e.preventDefault(); talk.classList.add('active'); startPTT(); };
const up = e => { e.preventDefault(); talk.classList.remove('active'); stopPTT(); };
talk.addEventListener('touchstart', down, { passive: false }); talk.addEventListener('touchend', up); talk.addEventListener('touchcancel', up);
talk.addEventListener('mousedown', down); talk.addEventListener('mouseup', up); talk.addEventListener('mouseleave', e => { if (talk.classList.contains('active')) up(e); });
$('#btnVoice').onclick = () => { cfg.voiceOn = !cfg.voiceOn; LS.set('voiceOn', cfg.voiceOn); if (!cfg.voiceOn) shutUp(); setStatus(); add('s', cfg.voiceOn ? '🔈 목소리 켬' : '🔇 목소리 끔'); };
$('#btnAlways').onclick = () => { cfg.always = !cfg.always; setStatus(); cfg.always ? startAlways() : stopAlways(); add('s', cfg.always ? '👂 항상 듣기 (호출어: ' + (cfg.wake || '없음') + ')' : '👂 항상 듣기 끔'); };
ring.onclick = () => { if (synth.speaking) { shutUp(); if (abortCtl) abortCtl.abort(); } };
$('#txt').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value; e.target.value = ''; onHeard(v, false); } });
$('#btnMem').onclick = () => add('g', '🧠 기억\n' + tools.recall({}) + '\n\n📝 메모\n' + tools.read_notes());

/* ---------------- 빠른 버튼 ---------------- */
function renderQuick() {
  const q = $('#quick'); q.innerHTML = '';
  cfg.quick.split('\n').map(l => l.split('=')).filter(a => a[0] && a[1]).slice(0, 6).forEach(([name, say]) => {
    const b = document.createElement('button'); b.textContent = name.trim(); b.onclick = () => onHeard(say.trim(), false); q.appendChild(b);
  });
}
/* ---------------- 백업 ---------------- */
$('#sExport').onclick = () => {
  const data = { v: 1, when: new Date().toISOString(), memory, notes, history, cfg: { ...cfg, key: '', srvTok: '' } };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' })); a.download = `gong-backup-${data.when.slice(0, 10)}.json`; a.click();
};
$('#sImport').onclick = () => $('#imp').click();
$('#imp').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.memory) { memory = d.memory; LS.set('memory', memory); } if (d.notes) { notes = d.notes; LS.set('notes', notes); } if (d.history) { history = d.history; LS.set('history', history); }
    if (d.cfg) for (const k of ['model', 'vision', 'user', 'wake', 'voiceName', 'rate', 'persona', 'home', 'srv', 'quick']) if (d.cfg[k] !== undefined) { cfg[k] = d.cfg[k]; LS.set(k, cfg[k]); }
    renderQuick(); setStatus(); $('#settings').classList.remove('open'); add('s', `백업 가져옴 (기억 ${memory.length}, 메모 ${notes.length})`);
  } catch (err) { add('s', '가져오기 실패: ' + err.message); }
  e.target.value = '';
};
$('#sTutorial').onclick = () => NATIVE ? (location.href = 'tutorial.html') : window.open('tutorial.html', '_blank');

/* ---------------- 설정 ---------------- */
function openSettings() { $('#sKey').value = cfg.key; fillModelSelects(); if (cfg.key && !cfg.models.length) fetchModels().then(fillModelSelects).catch(() => {}); $('#sUser').value = cfg.user; $('#sWake').value = cfg.wake; $('#sRate').value = cfg.rate; $('#sPersona').value = cfg.persona; $('#sHome').value = cfg.home; $('#sSrv').value = cfg.srv; $('#sSrvTok').value = cfg.srvTok; $('#sQuick').value = cfg.quick; loadVoices(); $('#settings').classList.add('open'); }
$('#btnSet').onclick = openSettings;
$('#sSave').onclick = () => {
  const newKey = $('#sKey').value.trim(); if (newKey !== cfg.key) { cfg.models = []; LS.set('models', []); }
  cfg.key = newKey; cfg.model = $('#sModel').value; cfg.vision = $('#sVision').value; cfg.user = $('#sUser').value.trim(); cfg.wake = $('#sWake').value.trim();
  cfg.voiceName = $('#sVoice').value; cfg.rate = +$('#sRate').value; cfg.persona = $('#sPersona').value.trim();
  cfg.home = $('#sHome').value.trim(); cfg.srv = $('#sSrv').value.trim(); cfg.srvTok = $('#sSrvTok').value.trim(); cfg.quick = $('#sQuick').value;
  for (const k of ['key', 'model', 'vision', 'user', 'wake', 'voiceName', 'rate', 'persona', 'home', 'srv', 'srvTok', 'quick']) LS.set(k, cfg[k]);
  if (NATIVE) Android.setWake(cfg.wake);
  renderQuick(); $('#settings').classList.remove('open'); setStatus(); add('s', '설정 저장됨');
};
$('#sTestVoice').onclick = () => { cfg.voiceName = $('#sVoice').value; cfg.rate = +$('#sRate').value; const on = cfg.voiceOn; cfg.voiceOn = true; speak('안녕하세요, 공입니다. 이 목소리 어때요?'); cfg.voiceOn = on; };
$('#sClear').onclick = () => { history = []; LS.set('history', []); log.innerHTML = ''; $('#settings').classList.remove('open'); add('s', '대화 기록 지움'); };

/* ---------------- 시작 ---------------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
setStatus(); renderQuick();
add('s', cfg.key ? (NATIVE ? `공 온라인 (앱). 👂 항상 듣기는 화면 꺼져도 작동 · 알림창에서도 제어` : `공 온라인. 🎤 누른 채 말하기 · 👂 항상 듣기 · 🔈 목소리 · 📷 사진`) : '⚙ 설정에서 Groq API 키(무료)를 넣어주세요.');
history.slice(-6).forEach(m => add(m.role === 'user' ? 'u' : 'g', m.content));
</script>
</body>
